# Native (no-Docker) deployment site config - for use with the system's own nginx.
#
# Install: sudo cp deploy/nginx-site.conf /etc/nginx/sites-available/dptv-server
#          sudo ln -s /etc/nginx/sites-available/dptv-server /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default   # optional, frees up port 80
#          sudo nginx -t && sudo systemctl reload nginx
#
# Unlike frontend/nginx.conf (which is baked into the Docker frontend image and proxies to
# the "backend" container by its Docker Compose service name), this proxies to the backend
# on localhost, since in a native/LXC install both processes run on the same host.

server {
    listen 80;
    server_name _;
    root /opt/DPTV-Server/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/(player_api\.php|get\.php|xmltv\.php|live/|movie/|series/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
