# Optional: a second nginx site exposing ONLY the Xtream-Codes player
# endpoints on their own port, with everything else (the admin UI, /api/)
# left off it entirely. Use this when you want to publish just the XC
# server to the internet (e.g. through a Cloudflare Tunnel public
# hostname) while keeping the admin UI reachable only on your LAN via
# deploy/nginx-site.conf on port 80.
#
# Install alongside nginx-site.conf (do not replace it):
#   sudo cp deploy/nginx-site-xc-only.conf /etc/nginx/sites-available/dptv-xc
#   sudo ln -s /etc/nginx/sites-available/dptv-xc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then point your reverse proxy / tunnel (e.g. cloudflared's Service field
# in a public hostname rule) at http://<container-ip>:8081, and set
# DPTV_PUBLIC_BASE_URL to whatever public hostname/scheme actually reaches
# players from the outside (e.g. https://xc.yourdomain.com when fronted by
# Cloudflare, which serves public hostnames over HTTPS even though this
# nginx site itself only speaks plain HTTP internally).
#
# Change the `listen` port below if 8081 conflicts with something else on
# your host, and update the tunnel/proxy config to match.

server {
    listen 8081;
    server_name _;

    location ~ ^/(player_api\.php|get\.php|xmltv\.php|live/|movie/|series/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Everything else (the admin UI, /api/) simply doesn't exist on this
    # port - it's only ever reachable through nginx-site.conf on port 80.
    location / {
        return 404;
    }
}
