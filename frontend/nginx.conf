server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default (1m) is smaller than a real provider's M3U/playlist export can easily be -
    # a ~9,000-channel M3U is already ~3MB. Uploads (e.g. Import M3U) would otherwise fail with a
    # 413 before ever reaching the backend.
    client_max_body_size 100M;

    location / {
        try_files $uri /index.html;
    }

    # Everything below is proxied straight through to the backend so a
    # single host:port serves both the admin UI and the XC-compatible API
    # that IPTV players connect to.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location ~ ^/(player_api\.php|get\.php|xmltv\.php|live/|movie/|series/) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
