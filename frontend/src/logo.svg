<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- DPTV-Server: DPTV-Player's tile and play glyph (DPTV-Player tools/brand/make_dptv_brand.py geometry)
       in light blue, with a server-stack badge where DPTV Recorder has its record dot. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161D25"/>
      <stop offset="100%" stop-color="#0A0E13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6CCBFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#6CCBFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C2E9FF"/>
      <stop offset="100%" stop-color="#2E9FE6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="48" fill="none" stroke="#263443" stroke-width="2"/>
  <circle cx="122" cy="122" r="120" fill="url(#glow)"/>

  <path d="M 87 74 L 169 128 L 87 182 Z" fill="url(#play)" stroke="#1B5A80" stroke-width="3" stroke-linejoin="round"/>

  <!-- server badge: three stacked units -->
  <rect x="150" y="146" width="86" height="80" rx="12" fill="#0A0E13"/>
  <g fill="#16202A" stroke="#6CCBFF" stroke-width="4">
    <rect x="158" y="153" width="70" height="18" rx="5"/>
    <rect x="158" y="177" width="70" height="18" rx="5"/>
    <rect x="158" y="201" width="70" height="18" rx="5"/>
  </g>
  <g fill="#6CCBFF">
    <circle cx="169" cy="162" r="3"/><circle cx="169" cy="186" r="3"/><circle cx="169" cy="210" r="3"/>
    <rect x="186" y="160" width="32" height="4" rx="2"/>
    <rect x="186" y="184" width="32" height="4" rx="2"/>
    <rect x="186" y="208" width="32" height="4" rx="2"/>
  </g>
</svg>
